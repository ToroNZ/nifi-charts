apiVersion: v1
kind: Service
metadata:
  name: {{ include "nifi-registry.fullname" . }}
  labels:
    {{- include "nifi-registry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
    {{ if .Values.https.enabled }}
      targetPort: https
    {{ else }}
      targetPort: http
    {{ end }}
      protocol: TCP
      name: http
  selector:
    {{- include "nifi-registry.selectorLabels" . | nindent 4 }}
