{{ if .Values.https.cert.enabled }}
{{- $useExistingIssuer := and .Values.https.cert.existingIssuer .Values.https.cert.existingIssuer.name }}
{{- if not $useExistingIssuer }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ template "nifi-registry.fullname" $ }}
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ template "nifi-registry.fullname" $ }}-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  duration: {{ $.Values.https.cert.caDuration }}
  renewBefore: 5m1s
  commonName: {{ template "nifi-registry.fullname" $ }}-ca.{{ $.Release.Namespace }}.svc.{{ $.Values.https.cert.clusterDomain }}
  subject:
    organizations:
      - Nifi Registry
  secretName: {{ template "nifi-registry.fullname" $ }}-ca
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: {{ template "nifi-registry.fullname" $ }}
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ template "nifi-registry.fullname" $ }}-ca
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: {{ template "nifi-registry.fullname" $ }}-ca
{{- end }}
{{- $issuerName := "" }}
{{- $issuerKind := "" }}
{{- $issuerGroup := "" }}
{{- if $useExistingIssuer }}
{{- $issuerName = .Values.https.cert.existingIssuer.name }}
{{- $issuerKind = default "Issuer" .Values.https.cert.existingIssuer.kind }}
{{- $issuerGroup = default "cert-manager.io" .Values.https.cert.existingIssuer.group }}
{{- else }}
{{- $issuerName = printf "%s-ca" (template "nifi-registry.fullname" $) }}
{{- $issuerKind = "Issuer" }}
{{- $issuerGroup = "cert-manager.io" }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ template "nifi-registry.fullname" $ }}-client
  namespace: {{ $.Release.Namespace }}
spec:
  duration: {{ $.Values.https.cert.certDuration }}
  commonName: {{ .Values.https.cert.clientCommonName }}
  subject:
    organizations:
      - Nifi Registry
  secretName: {{ template "nifi-registry.fullname" $ }}-client
  privateKey:
    rotationPolicy: Always
  usages:
    - digital signature
    - content commitment
    - key encipherment
    - data encipherment
    - key agreement
    - server auth
    - client auth
  issuerRef:
    name: {{ $issuerName }}
    kind: {{ $issuerKind }}
{{- if eq $issuerKind "Issuer" }}
    group: {{ $issuerGroup }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ template "nifi-registry.fullname" $ }}-0
  namespace: {{ .Release.Namespace }}
spec:
  commonName: nifi-reg-1-{{ template "nifi-registry.fullname" $ }}.nifi-5.svc.cluster.local
  duration: {{ $.Values.https.cert.caDuration }}
  subject:
    organizations:
      - Nifi Registry
  secretName: {{ template "nifi-registry.fullname" $ }}-0
  privateKey:
    rotationPolicy: Always
  usages:
    - digital signature
    - content commitment
    - key encipherment
    - data encipherment
    - key agreement
    - server auth
    - client auth
  dnsNames:
{{ toYaml $.Values.https.cert.additionalDnsNames | indent 4 }}
    - localhost
  issuerRef:
    name: {{ $issuerName }}
    kind: {{ $issuerKind }}
{{- if eq $issuerKind "Issuer" }}
    group: {{ $issuerGroup }}
{{- end }}
{{ end }}
